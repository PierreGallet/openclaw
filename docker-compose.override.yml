services:
  openclaw-gateway:
    container_name: openclaw_gateway
    image: openclaw:custom
    # Deployment-specific cap (genius host = 15.5 GB shared). Bounds a
    # leak/runaway to this container instead of letting it contend for
    # the whole host's RAM (an unbounded OOM has taken the server down).
    # memswap_limit > mem_limit allows a brief spill to swap before kill.
    mem_limit: 3g
    memswap_limit: 5g
    # CPU cap: peak ~0.6 core; 2.0 is ample headroom and bounds a runaway.
    cpus: 2.0
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Claude Code (claude-cli/* models) keeps its subscription login here;
      # without the bind mount below it is lost on every image rebuild.
      CLAUDE_CONFIG_DIR: /home/node/.claude
    volumes:
      - "${OPENCLAW_CLAUDE_DIR:-${HOME:-/tmp}/.openclaw-claude}:/home/node/.claude"

  openclaw-cli:
    container_name: openclaw_cli
    image: openclaw:custom
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CLAUDE_CONFIG_DIR: /home/node/.claude
    volumes:
      - "${OPENCLAW_CLAUDE_DIR:-${HOME:-/tmp}/.openclaw-claude}:/home/node/.claude"

  # Nginx is managed by the genius (infra) repo
  # Ollama is managed by the genius (infra) repo

networks:
  default:
    name: shared_infra
    external: true
